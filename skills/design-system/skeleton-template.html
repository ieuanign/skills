<!doctype html>
<!--
  SKELETON — the markup contract every mockup page follows. This comment is its one source; keep it
  verbatim in every skeleton.html and every page built from one, so a reader parses any of them alike.

  Page
  - One self-contained file: CSS and JS inline, nothing from the network but fonts.
  - Relative paths here resolve from docs/design-system/; a page saved elsewhere rewrites them
    (from docs/design/, brand/logo.svg becomes ../design-system/brand/logo.svg).
  - Only the tokens and components below are used. A missing one is added here and to the
    reference page, then listed under the footer's additions.

  Screen
  - <section data-screen="<name>" data-req="REQ-57.1 REQ-57.3" data-surface="<surface>">
  - data-req holds every requirement id the screen covers, space-separated, each also shown as a
    <span class="req-chip"> in the section's <h2>.
  - data-surface is exactly one of: web, ios, android, email, pdf, notification. Its frame:
    web -> .frame-browser; ios, android -> .frame-phone; email -> .frame-email (its real width);
    pdf -> .frame-page; notification -> .frame-notification (a push banner, toast or SMS, drawn
    where it appears).
  - <ul class="behaviour"> beside the frame: at most six of the requirement's rules for the screen.

  State
  - Buttons inside the section's <div class="states">: <button data-state="<name>" data-kind="<kind>">.
    The first button is the default state.
  - data-kind is exactly one of: default, error, empty, loading, success, dialog, first-run.
    Every error state is data-kind="error"; its data-state names the error.
  - Each state's content is <div data-state-panel="<name>"> inside the frame, the name matching its
    button's data-state.

  Open choice
  - Where a new screen's structure is open: <div class="options"> with up to three
    <button data-option="<name>">, each showing its <div data-option-panel="<name>">.

  Copy
  - Real copy. A fact the PRD lacks is <mark data-placeholder>[What is missing]</mark>.

  Footer
  - <footer data-footer> holds three lists, each item one line:
    <ul data-list="open-choices"> every choice the PRD did not make;
    <ul data-list="placeholders"> every [Placeholder] on the page, by its text;
    <ul data-list="additions"> every token or component added to the skeleton for this page.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton</title>
<style>
/* Tokens. The two colour blocks hold identical keys. */
:root {
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;
  --text-sm: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.75rem;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 1rem;
  --space-4: 1.5rem;
  --space-5: 2.5rem;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
}
[data-theme="light"] {
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-border: #d4d4d8;
  --color-text: #18181b;
  --color-text-muted: #52525b;
  --color-primary: #1d4ed8;
  --color-on-primary: #ffffff;
  --color-danger: #b91c1c;
  --color-success: #15803d;
}
[data-theme="dark"] {
  --color-bg: #121214;
  --color-surface: #1f1f23;
  --color-border: #3f3f46;
  --color-text: #f4f4f5;
  --color-text-muted: #a1a1aa;
  --color-primary: #93b4fd;
  --color-on-primary: #0b1a3a;
  --color-danger: #f87171;
  --color-success: #4ade80;
}

/* Page chrome. */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-md);
  background: var(--color-bg);
  color: var(--color-text);
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
}
main { padding: var(--space-4); display: grid; gap: var(--space-5); }
section[data-screen] { display: grid; gap: var(--space-3); }
section[data-screen] h2 { margin: 0; font-size: var(--text-lg); display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.req-chip {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: normal;
  padding: 0 var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  color: var(--color-text-muted);
}
.screen-body { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
.behaviour { max-width: 22rem; margin: 0; padding-left: var(--space-4); color: var(--color-text-muted); }
.states, .options { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.states button, .options button, .theme-switch {
  font: inherit;
  font-size: var(--text-sm);
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  color: var(--color-text);
  cursor: pointer;
}
.states button[aria-pressed="true"], .options button[aria-pressed="true"] {
  background: var(--color-primary);
  color: var(--color-on-primary);
  border-color: var(--color-primary);
}
.states button[data-kind="error"] { border-color: var(--color-danger); }
[hidden] { display: none !important; }
mark[data-placeholder] { background: var(--color-surface); color: var(--color-text); outline: 1px dashed var(--color-border); }
footer[data-footer] { padding: var(--space-4); border-top: 1px solid var(--color-border); }

/* Frames. */
.frame-browser { width: 960px; max-width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-bg); }
.frame-browser .frame-bar { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-3); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.frame-browser .frame-bar span { width: 10px; height: 10px; border-radius: 50%; background: var(--color-border); }
.frame-browser .frame-url { flex: 1; margin-left: var(--space-2); padding: 0 var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); background: var(--color-bg); border-radius: var(--radius-sm); }
.frame-phone { width: 390px; min-height: 780px; border: 10px solid var(--color-text); border-radius: 44px; overflow: hidden; background: var(--color-bg); }
.frame-email { width: 600px; max-width: 100%; border: 1px solid var(--color-border); background: var(--color-bg); }
.frame-page { width: 210mm; min-height: 297mm; padding: 20mm; border: 1px solid var(--color-border); background: var(--color-bg); }
.frame-notification { width: 360px; padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface); border: 1px solid var(--color-border); }
.frame-content { padding: var(--space-4); }

/* Components. Named as the project's component kit names them. */
.button { font: inherit; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-primary); background: var(--color-primary); color: var(--color-on-primary); cursor: pointer; }
.button-secondary { background: var(--color-bg); color: var(--color-primary); }
.field { display: grid; gap: var(--space-1); }
.field input { font: inherit; padding: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); color: var(--color-text); }
.field-error { color: var(--color-danger); font-size: var(--text-sm); }
.card { padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
.alert-success { padding: var(--space-3); border-left: 4px solid var(--color-success); background: var(--color-surface); }
</style>
</head>
<body>
<header class="page-header">
  <h1>Skeleton</h1>
  <button class="theme-switch" type="button" data-theme-switch>Dark theme</button>
</header>

<main>
  <!-- An example of the contract; a mockup replaces it with its own screens. -->
  <section data-screen="sign-in" data-req="REQ-0.1" data-surface="web">
    <h2>Sign in <span class="req-chip">REQ-0.1</span></h2>
    <div class="states">
      <button type="button" data-state="default" data-kind="default">Default</button>
      <button type="button" data-state="wrong-password" data-kind="error">Wrong password</button>
      <button type="button" data-state="loading" data-kind="loading">Loading</button>
    </div>
    <div class="screen-body">
      <div class="frame-browser">
        <div class="frame-bar"><span></span><span></span><span></span><div class="frame-url">example.com/sign-in</div></div>
        <div class="frame-content">
          <div data-state-panel="default">
            <div class="field"><label for="ex-email">Email</label><input id="ex-email" type="email"></div>
            <p><button class="button" type="button">Sign in</button></p>
          </div>
          <div data-state-panel="wrong-password">
            <div class="field"><label for="ex-email-2">Email</label><input id="ex-email-2" type="email"><span class="field-error">That password is not right. <mark data-placeholder>[Attempts left]</mark> tries left.</span></div>
            <p><button class="button" type="button">Sign in</button></p>
          </div>
          <div data-state-panel="loading"><p>Signing you in…</p></div>
        </div>
      </div>
      <ul class="behaviour">
        <li>A wrong password shows how many tries are left.</li>
      </ul>
    </div>
  </section>
</main>

<footer data-footer>
  <h2>Open choices</h2>
  <ul data-list="open-choices"></ul>
  <h2>Placeholders</h2>
  <ul data-list="placeholders"><li>[Attempts left]</li></ul>
  <h2>Additions</h2>
  <ul data-list="additions"></ul>
</footer>

<script>
// Each section's buttons show the panel whose name matches; the first button is the default.
function wire(section, buttonAttr, panelAttr) {
  const buttons = [...section.querySelectorAll(`[${buttonAttr}]`)];
  const show = (name) => {
    buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.getAttribute(buttonAttr) === name)));
    section.querySelectorAll(`[${panelAttr}]`).forEach((p) => { p.hidden = p.getAttribute(panelAttr) !== name; });
  };
  buttons.forEach((b) => b.addEventListener("click", () => show(b.getAttribute(buttonAttr))));
  if (buttons.length) show(buttons[0].getAttribute(buttonAttr));
}
document.querySelectorAll("section[data-screen]").forEach((s) => {
  wire(s, "data-state", "data-state-panel");
  wire(s, "data-option", "data-option-panel");
});

const root = document.documentElement;
const themeSwitch = document.querySelector("[data-theme-switch]");
const setTheme = (t) => { root.dataset.theme = t; themeSwitch.textContent = t === "light" ? "Dark theme" : "Light theme"; };
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
themeSwitch.addEventListener("click", () => setTheme(root.dataset.theme === "light" ? "dark" : "light"));
</script>
</body>
</html>
